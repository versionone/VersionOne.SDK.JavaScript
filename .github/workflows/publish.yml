name: Publish

# Publishes @versionone/agility-sdk to npmjs when a version tag is pushed:
#   git tag v1.0.0-alpha.0 && git push origin v1.0.0-alpha.0
#
# A prerelease (1.0.0-alpha.0, -beta.1, -rc.2) goes out on its own dist-tag
# (alpha, beta, rc), so `npm install @versionone/agility-sdk` never picks it
# up; only a plain version moves `latest`.
#
# Staged publishing: the workflow runs `npm stage publish`, which places the
# version in the registry where nobody can install it yet. A maintainer then
# approves it with 2FA, and only then does it go out:
#   npm stage approve <stage-id>        (or Approve on the package's npmjs page)
# The stage ID is printed in the run's summary. `npm stage reject <stage-id>`
# discards it instead. A trusted-publisher token can stage but never approve,
# so CI alone can never put a version on npm.
#
# Authentication is npm trusted publishing (OIDC): on the package's npmjs
# settings, link organization versionone, repository VersionOne.SDK.JavaScript,
# workflow publish.yml and environment npm, and allow `npm stage publish`
# (npm recommends leaving plain `npm publish` disallowed). No token is stored.
# An NPM_TOKEN secret, if set, is used as a fallback; it, too, can only stage.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The GitHub environment "npm" holds the approval rule (a required
    # reviewer, v* tags only), and npm's trusted-publisher link names it, so
    # only a run in this environment can publish.
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never restore a dependency cache in the job that holds the OIDC
          # token (setup-node's own advice for trusted publishing).
          package-manager-cache: false
      # `npm stage` needs npm 11.15.0 or later. Node 24 has shipped npm 11.16+
      # since 24.18.0 (June 2026); this keeps the floor if the runner's
      # toolcache lags.
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - name: The tag names the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - run: npm run verify
      - name: Choose the dist-tag
        run: |
          case "${VERSION}" in
            *-*) tag="$(echo "${VERSION#*-}" | sed 's/[.0-9]*$//')" ;;
            *) tag=latest ;;
          esac
          if [ -z "${tag}" ]; then tag=next; fi
          echo "DIST_TAG=${tag}" >> "$GITHUB_ENV"
          echo "Staging ${VERSION} with dist-tag ${tag}"
      - name: Stage the release
        run: |
          npm stage publish --provenance --access public --tag "${DIST_TAG}" | tee stage.out
          stage_id="$(sed -n 's/.*(staged with id \([^)]*\)).*/\1/p' stage.out | tail -n 1)"
          {
            echo "## Staged @versionone/agility-sdk@${VERSION} (dist-tag ${DIST_TAG})"
            echo
            echo "Nothing is published until a maintainer approves it with 2FA:"
            echo
            echo '```sh'
            if [ -n "${stage_id}" ]; then
              echo "npm stage view ${stage_id}       # check what was staged"
              echo "npm stage approve ${stage_id}    # publish it"
              echo "npm stage reject ${stage_id}     # discard it"
            else
              echo "npm stage list @versionone/agility-sdk   # find the stage ID"
            fi
            echo '```'
            echo
            echo "Or approve it on https://www.npmjs.com/package/@versionone/agility-sdk"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
