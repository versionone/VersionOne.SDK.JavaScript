name: CI

on:
  pull_request:
  push:
    branches: [master, proposed_type_script_api_version]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The Node lines the package supports (engines.node >=22): every
        # LTS line still maintained by Node.js. Drop a line when it reaches
        # end of life and raise engines.node in the same change.
        node: [22, 24, 26]
        # Windows too: tools that read paths as globs (tsup's entries) break
        # on backslashes, and people develop the SDK there.
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Unit tier only: the integration tier needs a testing instance and writes fixtures.
      - run: npm run verify
      - name: Pack
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: npm pack
      - uses: actions/upload-artifact@v7
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        with:
          name: versionone-agility-sdk-tarball
          path: versionone-agility-sdk-*.tgz
