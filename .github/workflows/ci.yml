name: CI

on:
  pull_request:
  push:
    branches: [master, proposed_type_script_api_version]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        # Windows too: tools that read paths as globs (tsup's entries) break
        # on backslashes, and people develop the SDK there.
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Unit tier only: the integration tier needs a testing instance and writes fixtures.
      - run: npm run verify
      - name: Pack
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: npm pack
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        with:
          name: versionone-agility-sdk-tarball
          path: versionone-agility-sdk-*.tgz
