name: CI

on:
  pull_request:
  push:
    branches: [master, proposed_type_script_api_version]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Unit tier only: the integration tier needs a testing instance and writes fixtures.
      - run: npm run verify
      - name: Pack
        if: matrix.node == 24
        run: npm pack
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: versionone-sdk-tarball
          path: versionone-sdk-*.tgz
